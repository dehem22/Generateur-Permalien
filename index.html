<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Permalien - Archives Départementales & Municipales</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 680px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f8;
            color: #1a1a1a;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            font-size: 0.9em;
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 70px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .reset-btn {
            background-color: #6c757d;
            width: 100%;
        }
        .reset-btn:hover {
            background-color: #5a6268;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            word-break: break-all;
        }
        .copy-btn {
            background-color: #28a745;
            margin-top: 10px;
            width: 100%;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
        .open-btn {
            background-color: #17a2b8;
            margin-top: 10px;
            width: 100%;
            display: inline-block;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }
        .open-btn:hover {
            background-color: #138496;
        }
        .error {
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
        }
        details {
            margin-top: 15px;
            background-color: #eef4fc;
            border: 1px solid #b6d4fe;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.9em;
        }
        summary {
            font-weight: bold;
            color: #055160;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        details ol {
            margin: 10px 0 0 0;
            padding-left: 20px;
            line-height: 1.5;
        }
        details code {
            background-color: #d0e2ff;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }
        .icon-info-badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 20px;
            height: 20px;
            background-color: gainsboro;
            color: black;
            border-radius: 50%;
            font-family: serif;
            font-style: normal;
            font-weight: bold;
            font-size: 13px;
            user-select: none;
            vertical-align: middle;
            margin: 0 2px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Générateur de Permalien - Archives</h2>
    
    <label for="deptSelect">Choix du dépôt d'archives :</label>
    <select id="deptSelect" onchange="reinitialiser(); changerDepartement();">
        <option value="09">09 - Ariège (AD)</option>
        <option value="11">11 - Aude (AD)</option>
        <option value="38" selected>38 - Isère (AD)</option>
        <option value="61">61 - Orne (AD)</option>
        <option value="66">66 - Pyrénées-Orientales (AD)</option>
        <option value="73">73 - Savoie (AD)</option>
        <option value="75">75 - Paris (AD)</option>
        <option value="77">77 - Seine-et-Marne (AD)</option>
        <option value="am_nantes">44 - Nantes (AM)</option>
        <option value="am_saint_etienne">42 - Saint-Étienne (AM)</option>
    </select>

    <!-- Groupe standard pour la plupart des AD -->
    <div id="standardGroup">
        <label for="baseUrl">Base de l'URL :</label>
        <input type="text" id="baseUrl" value="" oninput="genererPermalien()">

        <label for="coteInput">Cote du document :</label>
        <input type="text" id="coteInput" placeholder="" oninput="genererPermalien()">

        <div id="infoGroup">
            <label for="infoInput">Information ou nom de l'image (Bouton <span class="icon-info-badge">i</span>) :</label>
            <input type="text" id="infoInput" placeholder="Collez le texte issu du bouton i..." oninput="analyserInfoImage(); genererPermalien();">
        </div>
    </div>

    <!-- Groupe pour Paris & Saint-Étienne -->
    <div id="urlGroup" style="display: none;">
        <label id="urlInputLabel" for="urlInput">URL issue de la recherche :</label>
        <textarea id="urlInput" placeholder="Collez l'URL complète ici..." oninput="genererPermalien()"></textarea>
    </div>

    <!-- Groupe pour Nantes -->
    <div id="nantesGroup" style="display: none;">
        <label for="nantesUrlInput">URL de la visionneuse / permalien initial :</label>
        <textarea id="nantesUrlInput" placeholder="Ex: https://archives-numerisees.nantes.fr/v2/am441/visualiseur/etatcivil.html?id=451004743" oninput="genererPermalien()"></textarea>
    </div>

    <!-- Groupe pour la Savoie -->
    <div id="savoieGroup" style="display: none;">
        <label for="savoieUrlInput">URL de la visionneuse (barre d'adresse) :</label>
        <textarea id="savoieUrlInput" placeholder="Ex: https://archives-numeriques.savoie.fr/v2/ark:/77293/6ae5acf21f8157119af4c4b33679182c" oninput="genererPermalien()"></textarea>
    </div>

    <!-- Numéro de la vue -->
    <div id="pageGroup">
        <label for="pageInput">N° de la vue / page désirée :</label>
        <input type="number" id="pageInput" placeholder="Ex: 1" min="1" value="1" oninput="genererPermalien()">
    </div>

    <details open>
        <summary id="infoTitle">
            Comment récupérer les informations ?
        </summary>
        <ol id="instructions">
        </ol>
    </details>

    <div class="btn-group">
        <button type="button" class="reset-btn" onclick="reinitialiser()">Effacer les champs</button>
    </div>

    <div id="errorMsg" class="error"></div>

    <div id="resultContainer" style="display: none;">
        <label>Permalien généré :</label>
        <div id="resultUrl" class="result-box"></div>
        <button type="button" id="copyBtn" class="copy-btn" onclick="copierUrl()">Copier le lien</button>
        <a id="openBtn" class="open-btn" href="#" target="_blank" style="padding: 12px; border-radius: 4px; color: white; font-weight: bold;">Ouvrir le permalien</a>
    </div>
</div>

<script>
const deptsConfig = {
    "09": {
        baseUrl: "https://mdr-archives.ariege.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "fichier",
        placeholderCote: "Ex: 1NUM/4E6",
        placeholderInfo: "Ex: AD09_5Mi0028_4E0006_0038.jpg"
    },
    "11": {
        baseUrl: "https://mdr.aude.fr/mdr_aude/index.php/docnumViewer/afficheUdDocNum/",
        mode: "fichier",
        placeholderCote: "Ex: 100NUM/5E1/6",
        placeholderInfo: "Ex: AD11_5Mi0151_5E001_006_nmd_0018.JPG"
    },
    "38": {
        baseUrl: "http://archivesenligne.archives-isere.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "mixed",
        placeholderCote: "Ex: 9NUM/5E12/7",
        placeholderInfo: "Ex: FRAD038_3E12_7_0001.jpg"
    },
    "61": {
        baseUrl: "https://gaia.orne.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "mixed",
        placeholderCote: "Ex: 3NUMECEC12F>2_001_408",
        placeholderInfo: "Ex: 3NUMECEC12F_2_001_408_0001.jpg"
    },
    "66": {
        baseUrl: "https://archives.cd66.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "mixed",
        placeholderCote: "Ex: 9NUM2E2901",
        placeholderInfo: "Ex: FRAD066_9NUM2E2901_0001.jpg"
    },
    "75": {
        baseUrl: "https://archives.paris.fr/archives-numerisees/etat-civil-de-paris/etat-civil-a-partir-de-1860/consulter-les-actes-detat-civil",
        mode: "paris"
    },
    "77": {
        baseUrl: "https://archives-en-ligne.seine-et-marne.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "fichier",
        placeholderCote: "Ex: 6e91/13",
        placeholderInfo: "Ex: frad077_6e0091_013_075.jpg"
    },
    "73": {
        mode: "savoie"
    },
    "am_nantes": {
        mode: "nantes"
    },
    "am_saint_etienne": {
        baseUrl: "https://archives.saint-etienne.fr/recherches-et-consultation-1/recherche-documentaire/genealogie",
        mode: "saint_etienne"
    }
};

function changerDepartement() {
    const dept = document.getElementById('deptSelect').value;
    const config = deptsConfig[dept];
    
    const standardGroup = document.getElementById('standardGroup');
    const urlGroup = document.getElementById('urlGroup');
    const nantesGroup = document.getElementById('nantesGroup');
    const savoieGroup = document.getElementById('savoieGroup');
    const infoGroup = document.getElementById('infoGroup');
    const pageGroup = document.getElementById('pageGroup');
    const instructions = document.getElementById('instructions');
    const infoTitle = document.getElementById('infoTitle');
    const urlInputLabel = document.getElementById('urlInputLabel');

    document.getElementById('pageInput').value = 1;

    // Réinitialisation des affichages
    standardGroup.style.display = "none";
    urlGroup.style.display = "none";
    nantesGroup.style.display = "none";
    savoieGroup.style.display = "none";
    pageGroup.style.display = "block";

    if (config.mode === "paris") {
        urlGroup.style.display = "block";
        urlInputLabel.innerText = "URL longue issue de la recherche (Paris) :";
        infoTitle.innerHTML = "Comment utiliser le générateur pour Paris ?";
        instructions.innerHTML = `
            <li>Sélectionnez Paris (75).</li>
            <li>Collez l'URL longue issue de votre recherche.</li>
            <li>Indiquez le numéro de vue / page désirée.</li>
        `;
    } else if (config.mode === "saint_etienne") {
        urlGroup.style.display = "block";
        urlInputLabel.innerText = "URL longue de la visionneuse (Arkaïa / Saint-Étienne) :";
        infoTitle.innerHTML = "Comment utiliser le générateur pour Saint-Étienne ?";
        instructions.innerHTML = `
            <li>Copiez l'URL longue depuis la barre d'adresse de la visionneuse.</li>
            <li>Collez-la dans le champ dédié.</li>
            <li>Ajustez le numéro de la vue si nécessaire (l'index sera automatiquement calculé).</li>
        `;
    } else if (config.mode === "savoie") {
        savoieGroup.style.display = "block";
        infoTitle.innerHTML = "Comment utiliser le générateur pour les AD de la Savoie ?";
        instructions.innerHTML = `
            <li>Dans la visionneuse de la Savoie, copiez l'URL de la barre d'adresse (ex: <code>.../v2/ark:/77293/6ae5acf21f8157119af4c4b33679182c</code>).</li>
            <li>Collez-la ci-dessus.</li>
            <li>Indiquez le numéro de la vue / page souhaitée : il est ajouté à l'adresse sous la forme <code>vue=&lt;n°&gt;</code> (un numéro hors bornes renvoie à la 1re page).</li>
        `;
    } else if (config.mode === "nantes") {
        nantesGroup.style.display = "block";
        infoTitle.innerHTML = "Comment utiliser le générateur pour les AM de Nantes ?";
        instructions.innerHTML = `
            <li>Copiez l'URL de la visionneuse (ex: <code>.../etatcivil.html?id=451004743</code>).</li>
            <li>Collez-la ci-dessus.</li>
            <li>Indiquez le numéro de la vue / page souhaitée (ex: 54).</li>
        `;
    } else {
        standardGroup.style.display = "block";
        infoGroup.style.display = "block";
        
        infoTitle.innerHTML = `Comment récupérer les informations avec le bouton <span class="icon-info-badge">i</span> ?`;

        document.getElementById('baseUrl').value = config.baseUrl;
        document.getElementById('coteInput').placeholder = config.placeholderCote;
        document.getElementById('infoInput').placeholder = config.placeholderInfo;

        instructions.innerHTML = `
            <li>Dans la visionneuse des AD, cliquez sur le bouton <span class="icon-info-badge">i</span> dans le bandeau sous l'image.</li>
            <li>Copiez l'information d'image affichée et collez-la dans le champ dédié.</li>
            <li>Le numéro de vue sera automatiquement extrait (ou réglé sur 1 par défaut).</li>
        `;
    }
    
    genererPermalien();
}

function analyserInfoImage() {
    const infoRaw = document.getElementById('infoInput').value.trim();
    const pageInput = document.getElementById('pageInput');

    if (!infoRaw) {
        pageInput.value = 1;
        return;
    }

    const match = infoRaw.match(/_(\d{3,4})\.(jpg|jpeg)/i);
    if (match) {
        pageInput.value = parseInt(match[1], 10);
    }
}

function genererPermalien() {
    const dept = document.getElementById('deptSelect').value;
    const config = deptsConfig[dept];
    
    const errorMsg = document.getElementById('errorMsg');
    const resultContainer = document.getElementById('resultContainer');
    const resultUrl = document.getElementById('resultUrl');
    const copyBtn = document.getElementById('copyBtn');
    const openBtn = document.getElementById('openBtn');

    errorMsg.innerText = "";
    resultContainer.style.display = "none";
    copyBtn.innerText = "Copier le lien";

    let urlFinale = "";

    if (config.mode === "paris") {
        const urlInput = document.getElementById('urlInput').value.trim();
        let pageCible = parseInt(document.getElementById('pageInput').value, 10);
        
        if (isNaN(pageCible) || pageCible < 1) {
            pageCible = 1;
            document.getElementById('pageInput').value = 1;
        }

        if (!urlInput) return;

        const regex = /(\/_recherche-api\/visionneuse-infos\/[^\/]+\/[^\/]+\/[^\/]+\/image\/\d+)/;
        const match = urlInput.match(regex);

        if (!match) {
            errorMsg.innerText = "URL invalide ou fragment de visionneuse introuvable.";
            return;
        }

        const baseVisionneuse = match[1];
        const indexPage = pageCible - 1;

        if (indexPage === 0) {
            urlFinale = `${config.baseUrl}#${baseVisionneuse}`;
        } else {
            urlFinale = `${config.baseUrl}#${baseVisionneuse}/${indexPage}`;
        }

    } else if (config.mode === "saint_etienne") {
        const rawInput = document.getElementById('urlInput').value.trim();
        let pageNum = parseInt(document.getElementById('pageInput').value, 10);

        if (!rawInput) return;

        let systemKey1 = "arko_default_619517ef1a5d5";
        let arkoFiche = "";
        let systemKey2 = "arko_default_61938e2788aec";
        let idImage = "";

        const matchFull = rawInput.match(/visionneuse-infos\/([^\/]+)\/(arko_fiche_[a-z0-9]+)\/([^\/]+)(?:\/image\/(\d+))?/i);

        if (matchFull) {
            systemKey1 = matchFull[1];
            arkoFiche = matchFull[2];
            systemKey2 = matchFull[3];
            if (matchFull[4]) idImage = matchFull[4];
        } else {
            const matchesFiche = [...rawInput.matchAll(/arko_fiche_([a-z0-9]+)/gi)];
            if (matchesFiche.length > 0) {
                arkoFiche = "arko_fiche_" + matchesFiche[matchesFiche.length - 1][1];
            }
            const matchImg = rawInput.match(/\/image\/(\d+)/i);
            if (matchImg) idImage = matchImg[1];
        }

        if (isNaN(pageNum) || pageNum < 1) {
            pageNum = 1;
            document.getElementById('pageInput').value = 1;
        }

        if (!arkoFiche) {
            errorMsg.innerText = "Impossible de trouver la clé arko_fiche dans l'URL.";
            return;
        }

        const indexVue = pageNum - 1;
        urlFinale = idImage
            ? `${config.baseUrl}#/_recherche-api/visionneuse-infos/${systemKey1}/${arkoFiche}/${systemKey2}/image/${idImage}/${indexVue}`
            : `${config.baseUrl}#/_recherche-api/visionneuse-infos/${systemKey1}/${arkoFiche}/${systemKey2}/${indexVue}`;

    } else if (config.mode === "savoie") {
        const savoieUrl = document.getElementById('savoieUrlInput').value.trim();
        let pageNum = parseInt(document.getElementById('pageInput').value, 10);

        if (!savoieUrl) return;

        if (isNaN(pageNum) || pageNum < 1) {
            pageNum = 1;
            document.getElementById('pageInput').value = 1;
        }

        try {
            // Remplace un éventuel vue= existant, sinon l'ajoute (« & » ou « ? » selon l'adresse)
            const urlObj = new URL(savoieUrl);
            urlObj.searchParams.set('vue', pageNum);
            urlFinale = urlObj.toString();
        } catch (e) {
            // Si l'URL saisie est partielle
            let cleanUrl = savoieUrl.replace(/&vue=\d+/g, '').replace(/\?vue=\d+/g, '');
            const separator = cleanUrl.includes('?') ? '&' : '?';
            urlFinale = `${cleanUrl}${separator}vue=${pageNum}`;
        }

    } else if (config.mode === "nantes") {
        const nantesUrl =document.getElementById('nantesUrlInput').value.trim();
        let pageNum = parseInt(document.getElementById('pageInput').value, 10);

        if (!nantesUrl) return;

        if (isNaN(pageNum) || pageNum < 1) {
            pageNum = 1;
            document.getElementById('pageInput').value = 1;
        }

        try {
            const urlObj = new URL(nantesUrl);
            urlObj.searchParams.set('vue', pageNum);
            urlFinale = urlObj.toString();
        } catch (e) {
            // Si l'URL saisie est partielle
            let cleanUrl = nantesUrl.replace(/&vue=\d+/g, '').replace(/\?vue=\d+/g, '');
            const separator = cleanUrl.includes('?') ? '&' : '?';
            urlFinale = `${cleanUrl}${separator}vue=${pageNum}`;
        }

    } else {
        const baseUrl = document.getElementById('baseUrl').value.trim();
        const coteRaw = document.getElementById('coteInput').value.trim();
        let infoRaw = document.getElementById('infoInput').value.trim();
        let pageNum = parseInt(document.getElementById('pageInput').value, 10);

        if (isNaN(pageNum) || pageNum < 1) {
            pageNum = 1;
            document.getElementById('pageInput').value = 1;
        }

        if (!coteRaw) return;

        if (infoRaw) {
            let prefixeClean = "";
            let digitsCount = 3;

            const matchFull = infoRaw.match(/([A-Za-z0-9_]+)_(\d{3,4})\.(jpg|jpeg)/i);
            if (matchFull) {
                prefixeClean = matchFull[1];
                digitsCount = matchFull[2].length;
            } else {
                prefixeClean = infoRaw.replace(/^Image:\s*/i, '')
                                     .replace(/\.(jpg|jpeg)$/i, '')
                                     .replace(/_\d{3,4}$/, '');
            }

            const numPageFormatted = pageNum.toString().padStart(digitsCount, '0');
            const fichierNom = `${prefixeClean}_${numPageFormatted}.JPG`;
            urlFinale = `${baseUrl}?cote=${encodeURIComponent(coteRaw)}&fichier=${encodeURIComponent(fichierNom)}`;
        } else {
            urlFinale = `${baseUrl}?cote=${encodeURIComponent(coteRaw)}&numDocument=${pageNum}`;
        }
    }

    resultUrl.innerText = urlFinale;
    openBtn.href = urlFinale;
    resultContainer.style.display = "block";
}

function copierUrl() {
    const textToCopy = document.getElementById('resultUrl').innerText;
    const copyBtn = document.getElementById('copyBtn');

    navigator.clipboard.writeText(textToCopy).then(() => {
        copyBtn.innerText = "Copié !";
        setTimeout(() => {
            copyBtn.innerText = "Copier le lien";
        }, 2000);
    });
}

function reinitialiser() {
    document.getElementById('coteInput').value = "";
    document.getElementById('infoInput').value = "";
    document.getElementById('urlInput').value = "";
    document.getElementById('nantesUrlInput').value = "";
    document.getElementById('savoieUrlInput').value = "";
    document.getElementById('pageInput').value = 1;
    document.getElementById('errorMsg').innerText = "";
    document.getElementById('resultContainer').style.display = "none";
}

// Noms alternatifs acceptés (en plus des valeurs de la liste : 09, 11, 38, am_nantes...)
const alias = {
    "savoie": "73",
    "nantes": "am_nantes", "44": "am_nantes",
    "saint_etienne": "am_saint_etienne", "st_etienne": "am_saint_etienne",
    "saintetienne": "am_saint_etienne", "42": "am_saint_etienne"
};

// Met en minuscules, enlève les accents, remplace espaces et tirets par « _ »
function normaliser(valeur) {
    return valeur.trim().toLowerCase()
        .normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[-\s]+/g, "_");
}

// Lit le département dans l'adresse. Supporte #dept=11, ?dept=11, #archive=11
// et la valeur seule (#am_nantes, #savoie...).
function departementDepuisAdresse() {
    const brut = window.location.hash.substring(1) || window.location.search.substring(1);
    if (!brut) return null;
    let valeur;
    if (brut.includes("=")) {
        const params = new URLSearchParams(brut);
        valeur = params.get('dept') || params.get('archive');
    } else {
        valeur = brut;
    }
    if (!valeur) return null;
    const v = normaliser(decodeURIComponent(valeur));
    if (deptsConfig[v]) return v;
    if (alias[v]) return alias[v];
    if (deptsConfig["am_" + v]) return "am_" + v;
    return null;
}

function appliquerAdresse() {
    const deptParam = departementDepuisAdresse();
    if (deptParam) {
        document.getElementById('deptSelect').value = deptParam;
        reinitialiser();
    }
    changerDepartement();
}

window.onload = appliquerAdresse;

// Page déjà ouverte dans l'onglet : un changement de # ne recharge pas la page
window.addEventListener('hashchange', appliquerAdresse);
</script>

</body>
</html>
