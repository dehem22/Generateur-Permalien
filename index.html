<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Permalien - Archives Départementales</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 680px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f8;
            color: #1a1a1a;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            font-size: 0.9em;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .reset-btn {
            background-color: #6c757d;
            width: 100%;
        }
        .reset-btn:hover {
            background-color: #5a6268;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            word-break: break-all;
        }
        .copy-btn {
            background-color: #28a745;
            margin-top: 10px;
            width: 100%;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
        .open-btn {
            background-color: #17a2b8;
            margin-top: 10px;
            width: 100%;
            display: inline-block;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }
        .open-btn:hover {
            background-color: #138496;
        }
        .error {
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
        }
        details {
            margin-top: 15px;
            background-color: #eef4fc;
            border: 1px solid #b6d4fe;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.9em;
        }
        summary {
            font-weight: bold;
            color: #055160;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        details ol {
            margin: 10px 0 0 0;
            padding-left: 20px;
            line-height: 1.5;
        }
        details code {
            background-color: #d0e2ff;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }
        .icon-info-badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 20px;
            height: 20px;
            background-color: gainsboro;
            color: black;
            border-radius: 50%;
            font-family: serif;
            font-style: normal;
            font-weight: bold;
            font-size: 13px;
            user-select: none;
            vertical-align: middle;
            margin: 0 2px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Générateur de Permalien - Archives Départementales</h2>
    
    <label for="deptSelect">Choix du département :</label>
    <select id="deptSelect" onchange="reinitialiser(); changerDepartement();">
        <option value="09">09 - Ariège</option>
        <option value="11">11 - Aude</option>
        <option value="38" selected>38 - Isère</option>
        <option value="61">61 - Orne</option>
        <option value="66">66 - Pyrénées-Orientales</option>
        <option value="75">75 - Paris</option>
        <option value="77">77 - Seine-et-Marne</option>
    </select>

    <div id="standardGroup">
        <label for="baseUrl">Base de l'URL :</label>
        <input type="text" id="baseUrl" value="" oninput="genererPermalien()">

        <label for="coteInput">Cote du document :</label>
        <input type="text" id="coteInput" placeholder="" oninput="genererPermalien()">

        <div id="infoGroup">
            <label for="infoInput">Information ou nom de l'image (Bouton <span class="icon-info-badge">i</span>) :</label>
            <input type="text" id="infoInput" placeholder="Collez le texte issu du bouton i..." oninput="analyserInfoImage(); genererPermalien();">
        </div>
    </div>

    <div id="parisGroup" style="display: none;">
        <label for="urlInput">URL longue issue de la recherche (Paris) :</label>
        <input type="text" id="urlInput" placeholder="Collez l'URL complète ici..." oninput="genererPermalien()">
    </div>

    <div id="pageGroup">
        <label for="pageInput">N° de la vue / page désirée :</label>
        <input type="number" id="pageInput" placeholder="Ex: 1" min="1" value="1" oninput="genererPermalien()">
    </div>

    <details open>
        <summary id="infoTitle">
            Comment récupérer les informations avec le bouton <span class="icon-info-badge">i</span> ?
        </summary>
        <ol id="instructions">
            </ol>
    </details>

    <div class="btn-group">
        <button type="button" class="reset-btn" onclick="reinitialiser()">Effacer les champs</button>
    </div>

    <div id="errorMsg" class="error"></div>

    <div id="resultContainer" style="display: none;">
        <label>Permalien généré :</label>
        <div id="resultUrl" class="result-box"></div>
        <button type="button" id="copyBtn" class="copy-btn" onclick="copierUrl()">Copier le lien</button>
        <a id="openBtn" class="open-btn" href="#" target="_blank" style="padding: 12px; border-radius: 4px; color: white; font-weight: bold;">Ouvrir le permalien</a>
    </div>
</div>

<script>
const deptsConfig = {
    "09": {
        baseUrl: "https://mdr-archives.ariege.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "fichier",
        placeholderCote: "Ex: 1NUM/4E6",
        placeholderInfo: "Ex: AD09_5Mi0028_4E0006_0038.jpg"
    },
    "11": {
        baseUrl: "https://mdr.aude.fr/mdr_aude/index.php/docnumViewer/afficheUdDocNum/",
        mode: "fichier",
        placeholderCote: "Ex: 100NUM/5E1/6",
        placeholderInfo: "Ex: AD11_5Mi0151_5E001_006_nmd_0018.JPG"
    },
    "38": {
        baseUrl: "http://archivesenligne.archives-isere.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "mixed",
        placeholderCote: "Ex: 9NUM/5E12/7",
        placeholderInfo: "Ex: FRAD038_3E12_7_0001.jpg"
    },
    "61": {
        baseUrl: "https://gaia.orne.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "mixed",
        placeholderCote: "Ex: 3NUMECEC12F>2_001_408",
        placeholderInfo: "Ex: 3NUMECEC12F_2_001_408_0001.jpg"
    },
    "66": {
        baseUrl: "https://archives.cd66.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "mixed",
        placeholderCote: "Ex: 9NUM2E2901",
        placeholderInfo: "Ex: FRAD066_9NUM2E2901_0001.jpg"
    },
    "75": {
        baseUrl: "https://archives.paris.fr/archives-numerisees/etat-civil-de-paris/etat-civil-a-partir-de-1860/consulter-les-actes-detat-civil",
        mode: "paris"
    },
    "77": {
        baseUrl: "https://archives-en-ligne.seine-et-marne.fr/mdr/index.php/docnumViewer/afficheUdDocNum/",
        mode: "fichier",
        placeholderCote: "Ex: 6e91/13",
        placeholderInfo: "Ex: frad077_6e0091_013_075.jpg"
    }
};

function changerDepartement() {
    const dept = document.getElementById('deptSelect').value;
    const config = deptsConfig[dept];
    
    const standardGroup = document.getElementById('standardGroup');
    const parisGroup = document.getElementById('parisGroup');
    const infoGroup = document.getElementById('infoGroup');
    const pageGroup = document.getElementById('pageGroup');
    const instructions = document.getElementById('instructions');

    document.getElementById('pageInput').value = 1;

    if (config.mode === "paris") {
        standardGroup.style.display = "none";
        parisGroup.style.display = "block";
        pageGroup.style.display = "block";

        instructions.innerHTML = `
            <li>Sélectionnez Paris (75).</li>
            <li>Collez l'URL longue issue de votre recherche.</li>
            <li>Indiquez le numéro de vue / page désirée (par défaut : 1).</li>
        `;
    } else {
        standardGroup.style.display = "block";
        parisGroup.style.display = "none";
        infoGroup.style.display = "block";
        pageGroup.style.display = "block";
        
        document.getElementById('baseUrl').value = config.baseUrl;
        document.getElementById('coteInput').placeholder = config.placeholderCote;
        document.getElementById('infoInput').placeholder = config.placeholderInfo;

        instructions.innerHTML = `
            <li>Dans la visionneuse des AD, cliquez sur le bouton <span class="icon-info-badge">i</span> dans le bandeau en bas à droite de l'image.</li>
            <li>Copiez l'information d'image affichée et collez-la dans le champ dédié.</li>
            <li>Le numéro de vue sera automatiquement extrait (ou réglé sur 1 par défaut).</li>
        `;
    }
    
    genererPermalien();
}

function analyserInfoImage() {
    const infoRaw = document.getElementById('infoInput').value.trim();
    const pageInput = document.getElementById('pageInput');

    if (!infoRaw) {
        pageInput.value = 1;
        return;
    }

    // Extrait le numéro de séquence à la fin du nom de fichier (ex: 0018 ou 038)
    const match = infoRaw.match(/_(\d{3,4})\.(jpg|jpeg)/i);
    if (match) {
        pageInput.value = parseInt(match[1], 10);
    }
}

function genererPermalien() {
    const dept = document.getElementById('deptSelect').value;
    const config = deptsConfig[dept];
    
    const errorMsg = document.getElementById('errorMsg');
    const resultContainer = document.getElementById('resultContainer');
    const resultUrl = document.getElementById('resultUrl');
    const copyBtn = document.getElementById('copyBtn');
    const openBtn = document.getElementById('openBtn');

    errorMsg.innerText = "";
    resultContainer.style.display = "none";
    copyBtn.innerText = "Copier le lien";

    let urlFinale = "";

    if (config.mode === "paris") {
        const urlInput = document.getElementById('urlInput').value.trim();
        let pageCible = parseInt(document.getElementById('pageInput').value, 10);
        
        if (isNaN(pageCible) || pageCible < 1) {
            pageCible = 1;
            document.getElementById('pageInput').value = 1;
        }

        if (!urlInput) return;

        const regex = /(\/_recherche-api\/visionneuse-infos\/[^\/]+\/[^\/]+\/[^\/]+\/image\/\d+)/;
        const match = urlInput.match(regex);

        if (!match) {
            errorMsg.innerText = "URL invalide ou fragment de visionneuse introuvable.";
            return;
        }

        const baseVisionneuse = match[1];
        const indexPage = pageCible - 1;

        if (indexPage === 0) {
            urlFinale = `${config.baseUrl}#${baseVisionneuse}`;
        } else {
            urlFinale = `${config.baseUrl}#${baseVisionneuse}/${indexPage}`;
        }

    } else {
        const baseUrl = document.getElementById('baseUrl').value.trim();
        const coteRaw = document.getElementById('coteInput').value.trim();
        let infoRaw = document.getElementById('infoInput').value.trim();
        let pageNum = parseInt(document.getElementById('pageInput').value, 10);

        if (isNaN(pageNum) || pageNum < 1) {
            pageNum = 1;
            document.getElementById('pageInput').value = 1;
        }

        if (!coteRaw) return;

        if (infoRaw) {
            let prefixeClean = "";
            let digitsCount = 3;

            const matchFull = infoRaw.match(/([A-Za-z0-9_]+)_(\d{3,4})\.(jpg|jpeg)/i);
            if (matchFull) {
                prefixeClean = matchFull[1];
                digitsCount = matchFull[2].length;
            } else {
                prefixeClean = infoRaw.replace(/^Image:\s*/i, '')
                                     .replace(/\.(jpg|jpeg)$/i, '')
                                     .replace(/_\d{3,4}$/, '');
            }

            const numPageFormatted = pageNum.toString().padStart(digitsCount, '0');
            const fichierNom = `${prefixeClean}_${numPageFormatted}.JPG`;
            urlFinale = `${baseUrl}?cote=${encodeURIComponent(coteRaw)}&fichier=${encodeURIComponent(fichierNom)}`;
        } else {
            urlFinale = `${baseUrl}?cote=${encodeURIComponent(coteRaw)}&numDocument=${pageNum}`;
        }
    }

    resultUrl.innerText = urlFinale;
    openBtn.href = urlFinale;
    resultContainer.style.display = "block";
}

function copierUrl() {
    const textToCopy = document.getElementById('resultUrl').innerText;
    const copyBtn = document.getElementById('copyBtn');

    navigator.clipboard.writeText(textToCopy).then(() => {
        copyBtn.innerText = "Copié !";
        setTimeout(() => {
            copyBtn.innerText = "Copier le lien";
        }, 2000);
    });
}

function reinitialiser() {
    document.getElementById('coteInput').value = "";
    document.getElementById('infoInput').value = "";
    document.getElementById('urlInput').value = "";
    document.getElementById('pageInput').value = 1;
    document.getElementById('errorMsg').innerText = "";
    document.getElementById('resultContainer').style.display = "none";
}

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const deptParam = urlParams.get('dept');

    if (deptParam && deptsConfig[deptParam]) {
        document.getElementById('deptSelect').value = deptParam;
    }

    changerDepartement();
};
</script>

</body>
</html>
